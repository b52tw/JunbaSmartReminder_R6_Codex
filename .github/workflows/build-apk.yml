name: Build Android APK (debug development only)
run-name: R9 calendar month APK (${{ github.ref_name }})

on:
  workflow_dispatch:
  push:
    branches: [ main, master, codex/ai-reminder-flow, codex/simple-reminder ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Explain debug signing limitation
        run: echo '::warning::此流程使用開發用 debug 簽章，不保證能覆蓋手機舊版；固定簽章 APK 請使用 Build Signed Android APK，詳見 docs/APK_SIGNING.md。'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK manager and install SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK root does not exist: $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager is missing from $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 3 -type d | head -n 60 || true
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --version
          (yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses) >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Android SDK 35 installed successfully"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/tw/junba/reminder/MainActivity.java
          test -f app/src/main/java/tw/junba/reminder/NativeLinkStore.java
          test -f app/src/main/java/tw/junba/reminder/SimpleNote.java
          test -f app/src/main/java/tw/junba/reminder/CalendarNotificationListener.java
          gradle --version
          echo 'Project structure OK'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 --stacktrace assembleDebug testDebugUnitTest lintDebug

      - name: Verify output APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          APK_DIR=app/build/outputs/apk/debug
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK_DIR/app-debug.apk" > "$APK_DIR/signing-certificate.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK_DIR/app-debug.apk" > "$APK_DIR/apk-info.txt"
          (
            cd "$APK_DIR"
            sha256sum app-debug.apk > SHA256SUMS.txt
          )
          python3 - <<'PY'
          import os
          from pathlib import Path
          folder=Path('app/build/outputs/apk/debug')
          (folder/'source-commit.txt').write_text(os.environ['GITHUB_SHA']+'\n')
          summary='R9 月份瀏覽與通知對應測試版已通過建置、月份日期、通知對應、停止／延後與通知規則單元測試及 Lint。\n\n'
          summary+='下載本次執行的 **JunbaSmartReminder-R9-calendar-debug-APK** artifact，解壓後安裝 app-debug.apk。\n\n'
          summary+='這是 debug 測試版，未使用固定正式金鑰；不同簽章不能覆蓋手機舊版。請先保留資料並核對簽章，不要為安裝而直接解除安裝。\n\n'
          summary+='不含 App 內 AI；已加入唯讀月份瀏覽、帳號篩選與活動測試，需允許讀取手機日曆。紅燈只依真實 Google 通知紀錄，Junba 測試不點紅燈。儲存記事後送交原廠核對；完整日期仍需在原廠手動確認。可在 App 停止 Junba 響鈴、延後 10／30／60 分鐘、查看本機通知紀錄並手動交原廠建立。Junba 通知未允許時不新增響鈴。Google 日曆通知響鈴與鎖屏背景行為仍需 vivo 真機驗證。\n\n來源 commit：'+os.environ['GITHUB_SHA']+'\n'
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(summary)
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JunbaSmartReminder-R9-calendar-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
            app/build/outputs/apk/debug/signing-certificate.txt
            app/build/outputs/apk/debug/apk-info.txt
            app/build/outputs/apk/debug/source-commit.txt
          if-no-files-found: error
          retention-days: 30
